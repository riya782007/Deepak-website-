<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Soft Binomials Console</title>
<link rel="icon" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=DM+Mono:wght@400;500&display=swap">
<style>
[hidden]{display:none!important}
body{margin:0}
img{max-width:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
/* Layout: sticky left rail of modules + work area; drawer slides in from the right for detail and forms. */
:root{
  --bg:#F6F3FA; --surface:#FFFFFF; --surface-2:#F0EAF7; --line:#E3D9EE; --line-2:#D4C6E4;
  --fg:#22142F; --muted:#6A5B78; --faint:#9A8CA8;
  --accent:#6815A1; --accent-ink:#FFFFFF; --accent-soft:#EFE3FB; --accent-line:#CDB0EC;
  --mint:#DDF3E7; --mint-ink:#1D6A44; --peach:#FFE6D5; --peach-ink:#94451A;
  --rose:#FDE1EB; --rose-ink:#A11F4D; --sky:#E1EEFD; --sky-ink:#1D5799; --amber:#FFF0C7; --amber-ink:#755500;
  --good:#1F8A55; --warn:#B7791F; --bad:#C2365B;
  --scrim:rgba(24,12,36,.38);
  --shadow:0 1px 2px rgba(34,20,47,.05),0 10px 30px rgba(34,20,47,.07);
  --font:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --display:'Bricolage Grotesque','DM Sans',system-ui,sans-serif;
  --mono:'DM Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#15101C; --surface:#1E1727; --surface-2:#271E33; --line:#382B47; --line-2:#4A3A5D;
  --fg:#F2EBF9; --muted:#B4A5C4; --faint:#85769A;
  --accent:#BC8DF2; --accent-ink:#1B0F26; --accent-soft:#33224A; --accent-line:#5B3F82;
  --mint:#16382A; --mint-ink:#8FE0B5; --peach:#3C2516; --peach-ink:#F4B58B;
  --rose:#3D1828; --rose-ink:#F59BBB; --sky:#15283E; --sky-ink:#9EC7F6; --amber:#382D10; --amber-ink:#EFCF74;
  --good:#5ECB93; --warn:#E5B24E; --bad:#F27C9A; --scrim:rgba(0,0,0,.55);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15101C; --surface:#1E1727; --surface-2:#271E33; --line:#382B47; --line-2:#4A3A5D;
  --fg:#F2EBF9; --muted:#B4A5C4; --faint:#85769A;
  --accent:#BC8DF2; --accent-ink:#1B0F26; --accent-soft:#33224A; --accent-line:#5B3F82;
  --mint:#16382A; --mint-ink:#8FE0B5; --peach:#3C2516; --peach-ink:#F4B58B;
  --rose:#3D1828; --rose-ink:#F59BBB; --sky:#15283E; --sky-ink:#9EC7F6; --amber:#382D10; --amber-ink:#EFCF74;
  --good:#5ECB93; --warn:#E5B24E; --bad:#F27C9A; --scrim:rgba(0,0,0,.55);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font:14px/1.5 var(--font);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3{margin:0;text-wrap:balance}
.num,td.n,.money{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);font-size:12px;letter-spacing:.02em}

.app{display:grid;grid-template-columns:236px minmax(0,1fr);gap:22px;padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1560px;margin:0 auto}
.side{position:sticky;top:calc(16px + env(safe-area-inset-top,0px));align-self:start;height:calc(100dvh - 32px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:18px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px 12px}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 6px}
.mark{width:36px;height:36px;border-radius:11px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:700 15px/1 var(--display);letter-spacing:-.02em;flex:none}
.brand b{display:block;font:700 15px/1.15 var(--display);letter-spacing:-.01em}
.brand small{display:block;color:var(--muted);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase}
.nav{display:flex;flex-direction:column;gap:2px;overflow:auto}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:11px;color:var(--muted);text-decoration:none;font-weight:500;white-space:nowrap}
.nav a svg{width:18px;height:18px;flex:none}
.nav a:hover{background:var(--surface-2);color:var(--fg)}
.nav a[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav .cnt{margin-left:auto;background:var(--rose);color:var(--rose-ink);font-size:11.5px;font-weight:700;border-radius:20px;padding:0 7px;line-height:19px}
.side-foot{margin-top:auto;padding:12px 10px 2px;border-top:1px solid var(--line);display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12.5px}
.side-foot img{width:28px;height:28px;border-radius:50%}

.work{min-width:0;display:flex;flex-direction:column;gap:18px}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.top .ttl{flex:1 1 260px;min-width:0}
.top h1{font:700 26px/1.15 var(--display);letter-spacing:-.02em}
.top p{margin:2px 0 0;color:var(--muted)}
.search{position:relative;flex:0 1 300px;min-width:180px}
.search input{width:100%;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:0 12px 0 36px}
.search svg{position:absolute;left:11px;top:11px;width:18px;height:18px;color:var(--faint)}
.menu{position:relative}
.menu summary{list-style:none}
.menu summary::-webkit-details-marker{display:none}
.menu .pop{position:absolute;right:0;top:46px;z-index:30;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:6px;min-width:210px;display:flex;flex-direction:column}
.menu .pop button{all:unset;cursor:pointer;padding:9px 12px;border-radius:9px;font-weight:500}
.menu .pop button:hover,.menu .pop button:focus-visible{background:var(--surface-2)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:38px;padding:0 14px;border-radius:11px;border:1px solid var(--line-2);background:var(--surface);color:var(--fg);font-weight:600;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--accent-line);background:var(--surface-2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.08);background:var(--accent)}
.btn.sm{height:32px;padding:0 11px;border-radius:9px;font-size:13px}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 35%,transparent)}
.btn.wa{color:var(--good);border-color:color-mix(in srgb,var(--good) 35%,transparent)}
.btn svg{width:16px;height:16px}
.ro .w{display:none!important}

.banner{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:11px 14px;border-radius:14px;background:var(--amber);color:var(--amber-ink);font-weight:500}
.banner.info{background:var(--sky);color:var(--sky-ink)}
.banner .btn{margin-left:auto}

.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;min-width:0}
.card h2{font:700 16px/1.3 var(--display);letter-spacing:-.01em}
.card-h{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.card-h .more{margin-left:auto;font-weight:600;font-size:13px;text-decoration:none}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}

.hello{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.hello .quick{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
.kpi{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;min-width:0}
.kpi:hover{border-color:var(--accent-line)}
.kpi .l{color:var(--muted);font-size:12.5px;font-weight:600}
.kpi .v{font:700 26px/1.05 var(--display);letter-spacing:-.02em;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kpi .s{font-size:12px;color:var(--faint)}
.kpi.alert .v{color:var(--bad)}

.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:10px 2px;border-top:1px solid var(--line);min-width:0}
.row:first-child{border-top:0}
.row .main{flex:1;min-width:0}
.row .main b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .main span{display:block;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .side-act{display:flex;gap:6px;flex:none;align-items:center}
.linkrow{all:unset;cursor:pointer;flex:1;min-width:0}
.empty{color:var(--muted);padding:14px 2px;font-size:13.5px}
.empty-big{display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:26px;border:1.5px dashed var(--line-2);border-radius:18px;color:var(--muted)}
.empty-big b{color:var(--fg);font:700 17px/1.3 var(--display)}

.pill{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 9px;border-radius:20px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--surface-2);color:var(--muted)}
.pill.good{background:var(--mint);color:var(--mint-ink)}
.pill.warn{background:var(--amber);color:var(--amber-ink)}
.pill.bad{background:var(--rose);color:var(--rose-ink)}
.pill.info{background:var(--sky);color:var(--sky-ink)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.pill.peach{background:var(--peach);color:var(--peach-ink)}
.tag{display:inline-block;font-size:11.5px;padding:1px 8px;border-radius:7px;background:var(--surface-2);color:var(--muted);margin:2px 4px 0 0}
.row .main span.sample,.tcard .sample{display:inline-block}
.sample{display:inline-block;font:500 10px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;padding:3px 5px;border-radius:5px;background:var(--amber);color:var(--amber-ink);vertical-align:2px;margin-left:6px}

.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.toolbar .sp{flex:1}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{all:unset;cursor:pointer;height:30px;padding:0 12px;border-radius:20px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:500;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.chip:hover{border-color:var(--accent-line);color:var(--fg)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip .c{font-size:11.5px;opacity:.75}
select.inline{height:32px;border-radius:9px;border:1px solid var(--line);background:var(--surface);padding:0 8px}

.tbl{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:16px}
table{width:100%;border-collapse:collapse;min-width:760px}
th{text-align:left;font-size:12px;font-weight:600;color:var(--muted);padding:11px 14px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2)}
td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr{cursor:pointer}
tbody tr:hover td{background:color-mix(in srgb,var(--accent-soft) 45%,transparent)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
td .sub{display:block;color:var(--muted);font-size:12px}
tfoot td{font-weight:700;background:var(--surface-2)}

.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(228px,1fr);gap:12px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x proximity}
.col{background:var(--surface-2);border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:8px;scroll-snap-align:start;min-height:120px}
.col-h{display:flex;align-items:center;gap:8px;padding:4px 6px 6px;font-weight:700;font-size:13px}
.col-h .c{color:var(--muted);font-weight:500}
.tcard{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:5px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 12px;min-width:0}
.tcard:hover{border-color:var(--accent-line)}
.tcard b{font-weight:600}
.tcard .meta{color:var(--muted);font-size:12.5px;overflow-wrap:anywhere}
.tcard .foot{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:2px}
.late{color:var(--bad);font-weight:600}

.bcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.bcard{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;min-width:0}
.bcard:hover{border-color:var(--accent-line)}
.bcard h3{font:700 16px/1.25 var(--display)}
.bar{height:7px;border-radius:7px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:7px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}

.tabs{display:flex;gap:4px;background:var(--surface-2);padding:4px;border-radius:13px;width:max-content;max-width:100%;overflow-x:auto}
.tabs button{all:unset;cursor:pointer;padding:7px 14px;border-radius:10px;font-weight:600;color:var(--muted);white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}

.chart{display:flex;flex-direction:column;gap:8px}
.hb{display:grid;grid-template-columns:minmax(90px,38%) 1fr auto;gap:10px;align-items:center;font-size:13px}
.hb .lab{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
.hb .track{height:12px;background:var(--surface-2);border-radius:6px;overflow:hidden}
.hb .track i{display:block;height:100%;background:var(--accent);border-radius:6px}
.hb .val{font-variant-numeric:tabular-nums;font-weight:600;min-width:56px;text-align:right}
.cols{display:flex;align-items:flex-end;gap:10px;height:180px;padding-top:18px;border-bottom:1px solid var(--line)}
.cols .c{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;height:100%;min-width:0}
.cols .c i{display:block;width:100%;max-width:44px;background:var(--accent);border-radius:7px 7px 2px 2px;min-height:2px}
.cols .c.now i{background:var(--peach-ink)}
.cols .c span{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.cols-x{display:flex;gap:10px;margin-top:6px}
.cols-x span{flex:1;text-align:center;font-size:11.5px;color:var(--muted)}

.stagebar{display:flex;height:12px;border-radius:7px;overflow:hidden;background:var(--surface-2);margin:6px 0 10px}
.stagebar i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}

#scrim{position:fixed;inset:0;background:var(--scrim);z-index:40}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(580px,100%);z-index:41;background:var(--bg);border-left:1px solid var(--line);box-shadow:var(--shadow);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
@media (prefers-reduced-motion:no-preference){#drawer{animation:slidein .22s cubic-bezier(.2,.7,.2,1)}@keyframes slidein{from{transform:translateX(30px);opacity:.4}}}
.dh{display:flex;align-items:flex-start;gap:12px;padding:18px 20px 14px;border-bottom:1px solid var(--line);background:var(--surface)}
.dh h2{font:700 21px/1.2 var(--display);letter-spacing:-.015em}
.dh .sub{color:var(--muted);font-size:13px;margin-top:3px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.dh .x{margin-left:auto}
.db{flex:1;overflow:auto;padding:18px 20px 28px;display:flex;flex-direction:column;gap:14px}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.sect{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.sect h3{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px}
.fin{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.fin div{background:var(--surface-2);border-radius:12px;padding:10px 12px}
.fin span{display:block;font-size:12px;color:var(--muted)}
.fin b{font:700 19px/1.2 var(--display);font-variant-numeric:tabular-nums}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.chk{display:inline-flex;align-items:center;gap:7px;padding:6px 11px;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer;font-size:13px}
.chk input{accent-color:var(--accent);width:16px;height:16px;margin:0}
.chk:has(input:checked){border-color:var(--accent-line);background:var(--accent-soft)}

form.f{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0;border:0;padding:0;margin:0}
.fld.wide{grid-column:1/-1}
.fld>span,.fld legend{font-size:12.5px;font-weight:600;color:var(--muted);padding:0}
.fld input,.fld select,.fld textarea{width:100%;min-height:40px;border:1px solid var(--line-2);background:var(--surface);border-radius:10px;padding:8px 11px}
.fld textarea{resize:vertical}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:2px solid var(--accent-line);border-color:var(--accent)}
.fld .hint{font-size:12px;color:var(--faint)}
.f-acts{grid-column:1/-1;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;padding-top:6px}

.att{display:flex;flex-direction:column;gap:6px;max-height:340px;overflow:auto}
.att label{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;border:1px solid var(--line);cursor:pointer}
.att label:has(input:checked){background:var(--mint);border-color:transparent}
.att input{width:18px;height:18px;accent-color:var(--good)}
.att .pct{margin-left:auto;font-size:12px;color:var(--muted)}
.sess{display:flex;flex-wrap:wrap;gap:6px}

.map{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px 12px;align-items:center}
.map label{font-weight:600;font-size:13px}
.map select{height:36px;border-radius:9px;border:1px solid var(--line-2);background:var(--surface);padding:0 8px;width:100%}
.prev{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
.prev table{min-width:520px;font-size:12.5px}
.prev td,.prev th{padding:7px 10px}
.drop{display:flex;flex-direction:column;gap:8px;align-items:flex-start;border:1.5px dashed var(--line-2);border-radius:16px;padding:18px;background:var(--surface)}
.drop textarea{width:100%;min-height:110px;border:1px solid var(--line-2);border-radius:10px;padding:10px;background:var(--bg);font-family:var(--mono);font-size:12px}

#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
#toast.bad{background:var(--bad);color:#fff}

@media (max-width:1240px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:1000px){.g3{grid-template-columns:1fr 1fr}}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr);gap:14px}
  .side{position:static;height:auto;padding:10px;gap:8px;border-radius:16px}
