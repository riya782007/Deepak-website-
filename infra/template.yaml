AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Soft Binomials India - website hosting and operations console. Built to sit inside
  AWS always-free allowances: no servers, no API Gateway, no NAT, no WAF, no Route 53.

Parameters:
  AlertEmail:
    Type: String
    Description: Where the monthly cost alert is emailed.
  MonthlyBudgetUsd:
    Type: Number
    Default: 2
    Description: Alert threshold in US dollars. Expected spend is close to zero.
  ExtraOrigins:
    Type: CommaDelimitedList
    Default: 'http://127.0.0.1:5173,http://127.0.0.1:4173'
    Description: Other web addresses allowed to call the API (the live domain, local development).
  GitHubRepo:
    Type: String
    Default: riya782007@237364404/Deepak-website-@1443810576
    Description: >-
      The GitHub repository allowed to deploy (main and admin-console branches), as GitHub writes it
      in its sign-in token: owner@ownerId/repo@repoId. The ids stay the same if the repo is renamed.
  CodeS3Bucket:
    Type: String
    Default: ''
    Description: Optional. S3 bucket holding the API zip. Leave empty to deploy the code afterwards with update-function-code.
  CodeS3Key:
    Type: String
    Default: ''

Conditions:
  CodeFromS3: !Not [!Equals [!Ref CodeS3Bucket, '']]

Resources:
  # ---------- Data: one table, provisioned well inside the 25 read / 25 write always-free units ----------
  Table:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: sb-console
      BillingMode: PROVISIONED
      ProvisionedThroughput: {ReadCapacityUnits: 5, WriteCapacityUnits: 5}
      AttributeDefinitions:
        - {AttributeName: c, AttributeType: S}
        - {AttributeName: id, AttributeType: S}
        - {AttributeName: g, AttributeType: S}
        - {AttributeName: u, AttributeType: S}
      KeySchema:
        - {AttributeName: c, KeyType: HASH}
        - {AttributeName: id, KeyType: RANGE}
      GlobalSecondaryIndexes:
        - IndexName: changes
          KeySchema:
            - {AttributeName: g, KeyType: HASH}
            - {AttributeName: u, KeyType: RANGE}
          Projection: {ProjectionType: ALL}
          ProvisionedThroughput: {ReadCapacityUnits: 5, WriteCapacityUnits: 5}
      TimeToLiveSpecification: {AttributeName: ttl, Enabled: true}
      PointInTimeRecoverySpecification: {PointInTimeRecoveryEnabled: true}
      DeletionProtectionEnabled: true

  # ---------- Sign-in: Cognito Lite tier, 10,000 monthly users free ----------
  UserPool:
    Type: AWS::Cognito::UserPool
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      UserPoolName: sb-console-staff
      UserPoolTier: LITE
      DeletionProtection: ACTIVE
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
        InviteMessageTemplate:
          EmailSubject: Your Soft Binomials console access
          EmailMessage: !Sub >-
            You've been given access to the Soft Binomials admin console.
            Open https://${Distribution.DomainName}/admin/ and sign in with {username}
            and this temporary password: {####}
            You'll choose your own password the first time.
      AccountRecoverySetting:
        RecoveryMechanisms: [{Name: verified_email, Priority: 1}]
      Policies:
        PasswordPolicy: {MinimumLength: 10, RequireLowercase: true, RequireNumbers: true, RequireUppercase: false, RequireSymbols: false, TemporaryPasswordValidityDays: 7}
      EmailConfiguration: {EmailSendingAccount: COGNITO_DEFAULT}
      Schema:
        - {Name: email, AttributeDataType: String, Required: true, Mutable: true}
        - {Name: name, AttributeDataType: String, Required: false, Mutable: true}

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: console
      GenerateSecret: false
      ExplicitAuthFlows: [ALLOW_USER_PASSWORD_AUTH, ALLOW_REFRESH_TOKEN_AUTH]
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      IdTokenValidity: 30
      AccessTokenValidity: 30
      RefreshTokenValidity: 30
      TokenValidityUnits: {IdToken: minutes, AccessToken: minutes, RefreshToken: days}

  OwnerGroup: {Type: AWS::Cognito::UserPoolGroup, Properties: {UserPoolId: !Ref UserPool, GroupName: owner, Precedence: 1}}
  AdminGroup: {Type: AWS::Cognito::UserPoolGroup, Properties: {UserPoolId: !Ref UserPool, GroupName: admin, Precedence: 2}}
  StaffGroup: {Type: AWS::Cognito::UserPoolGroup, Properties: {UserPoolId: !Ref UserPool, GroupName: staff, Precedence: 3}}
  ViewerGroup: {Type: AWS::Cognito::UserPoolGroup, Properties: {UserPoolId: !Ref UserPool, GroupName: viewer, Precedence: 4}}

  # ---------- API: one Lambda function with its own free web address ----------
  ApiLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/sb-console-api
      RetentionInDays: 14

  ApiRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement: [{Effect: Allow, Principal: {Service: lambda.amazonaws.com}, Action: sts:AssumeRole}]
      Policies:
        - PolicyName: console-api
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:Query]
                Resource: [!GetAtt Table.Arn, !Sub '${Table.Arn}/index/changes']
              - Effect: Allow
                Action:
                  - cognito-idp:ListUsers
                  - cognito-idp:ListUsersInGroup
                  - cognito-idp:AdminCreateUser
                  - cognito-idp:AdminAddUserToGroup
                  - cognito-idp:AdminRemoveUserFromGroup
                  - cognito-idp:AdminDisableUser
                  - cognito-idp:AdminEnableUser
                  - cognito-idp:AdminUserGlobalSignOut
                Resource: !GetAtt UserPool.Arn
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt ApiLogs.Arn
              - Effect: Allow
                Action: [s3:PutObject, s3:DeleteObject]
                Resource: !Sub '${SiteBucket.Arn}/media/*'

  Api:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: sb-console-api
      Runtime: nodejs22.x
      Architectures: [arm64]
      Handler: index.handler
      MemorySize: 256
      Timeout: 10
      Role: !GetAtt ApiRole.Arn
      LoggingConfig: {LogGroup: !Ref ApiLogs}
      Environment:
        Variables:
          TABLE: !Ref Table
          POOL_ID: !Ref UserPool
          CLIENT_ID: !Ref UserPoolClient
          MEDIA_BUCKET: !Ref SiteBucket
          MEDIA_BASE: !Sub 'https://${Distribution.DomainName}'
      Code: !If
        - CodeFromS3
        - {S3Bucket: !Ref CodeS3Bucket, S3Key: !Ref CodeS3Key}
        - ZipFile: "exports.handler=async()=>({statusCode:503,body:'\"The console API is being installed\"'});"

  ApiUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !GetAtt Api.Arn
      AuthType: NONE
      Cors:
        AllowOrigins: !Split [',', !Join [',', [!Sub 'https://${Distribution.DomainName}', !Join [',', !Ref ExtraOrigins]]]]
        AllowMethods: [GET, POST, PUT, PATCH, DELETE]
        AllowHeaders: [authorization, content-type]
        MaxAge: 86400

  ApiUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref Api
      Action: lambda:InvokeFunctionUrl
      Principal: '*'
      FunctionUrlAuthType: NONE

  ApiInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref Api
      Action: lambda:InvokeFunction
      Principal: '*'
      InvokedViaFunctionUrl: true

  # ---------- Hosting: private S3 bucket behind CloudFront (1 TB a month free) ----------
  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'sb-site-${AWS::AccountId}'
      PublicAccessBlockConfiguration: {BlockPublicAcls: true, BlockPublicPolicy: true, IgnorePublicAcls: true, RestrictPublicBuckets: true}
      OwnershipControls: {Rules: [{ObjectOwnership: BucketOwnerEnforced}]}
      BucketEncryption: {ServerSideEncryptionConfiguration: [{ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}}]}
      # Website resource uploads go straight from the console to media/ with a signed,
      # 15-minute form (key, type and size are fixed by the signature), so any origin may POST.
      CorsConfiguration:
        CorsRules:
          - {AllowedMethods: [POST], AllowedOrigins: ['*'], AllowedHeaders: ['*'], MaxAge: 3000}

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: cloudfront.amazonaws.com}
            Action: s3:GetObject
            Resource: !Sub '${SiteBucket.Arn}/*'
            Condition: {StringEquals: {AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}'}}

  SiteOac:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig: {Name: !Sub 'sb-site-${AWS::AccountId}', OriginAccessControlOriginType: s3, SigningBehavior: always, SigningProtocol: sigv4}

  # Serves /about/ from /about/index.html. CloudFront Functions: 2 million calls a month free.
  IndexRewrite:
    Type: AWS::CloudFront::Function
    Properties:
      Name: sb-site-index
      AutoPublish: true
      FunctionConfig: {Comment: Folder URLs to index.html, Runtime: cloudfront-js-2.0}
      FunctionCode: |
        function handler(event) {
          var r = event.request;
          if (r.uri.endsWith('/')) r.uri += 'index.html';
          else if (r.uri.lastIndexOf('.') < r.uri.lastIndexOf('/') + 1) r.uri += '/index.html';
          return r;
        }

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: Soft Binomials India website and console
        HttpVersion: http2and3
        PriceClass: PriceClass_200
        DefaultRootObject: index.html
        Origins:
          - Id: site
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !Ref SiteOac
            S3OriginConfig: {OriginAccessIdentity: ''}
        DefaultCacheBehavior:
          TargetOriginId: site
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6       # Managed-CachingOptimized
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03 # Managed-SecurityHeadersPolicy
          FunctionAssociations: [{EventType: viewer-request, FunctionARN: !GetAtt IndexRewrite.FunctionMetadata.FunctionARN}]
        CustomErrorResponses:
          - {ErrorCode: 403, ResponseCode: 404, ResponsePagePath: /404.html, ErrorCachingMinTTL: 60}
          - {ErrorCode: 404, ResponseCode: 404, ResponsePagePath: /404.html, ErrorCachingMinTTL: 60}

  # ---------- Deploys from GitHub Actions with short-lived credentials (no stored keys) ----------
  GitHubOidc:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]

  GitHubDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: sb-github-deploy
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Federated: !Ref GitHubOidc}
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals: {'token.actions.githubusercontent.com:aud': sts.amazonaws.com}
              StringLike:
                'token.actions.githubusercontent.com:sub':
                  - !Sub 'repo:${GitHubRepo}:ref:refs/heads/main'
                  - !Sub 'repo:${GitHubRepo}:ref:refs/heads/admin-console'
      Policies:
        - PolicyName: deploy-site-and-api
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [s3:ListBucket]
                Resource: !GetAtt SiteBucket.Arn
              - Effect: Allow
                Action: [s3:PutObject, s3:DeleteObject]
                Resource: !Sub '${SiteBucket.Arn}/*'
              - Effect: Allow
                Action: [cloudfront:CreateInvalidation]
                Resource: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}'
              - Effect: Allow
                Action: [lambda:UpdateFunctionCode, lambda:GetFunction]
                Resource: !GetAtt Api.Arn
              - Effect: Allow
                Action: [cloudformation:DescribeStacks]
                Resource: !Ref AWS::StackId

  # ---------- Cost guard: emails if the month's bill heads past the threshold ----------
  Budget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: sb-monthly
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit: {Amount: !Ref MonthlyBudgetUsd, Unit: USD}
      NotificationsWithSubscribers:
        - Notification: {NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 50, ThresholdType: PERCENTAGE}
          Subscribers: [{SubscriptionType: EMAIL, Address: !Ref AlertEmail}]
        - Notification: {NotificationType: FORECASTED, ComparisonOperator: GREATER_THAN, Threshold: 100, ThresholdType: PERCENTAGE}
          Subscribers: [{SubscriptionType: EMAIL, Address: !Ref AlertEmail}]

Outputs:
  SiteUrl: {Value: !Sub 'https://${Distribution.DomainName}'}
  ConsoleUrl: {Value: !Sub 'https://${Distribution.DomainName}/admin/'}
  ApiUrl: {Value: !GetAtt ApiUrl.FunctionUrl}
  UserPoolId: {Value: !Ref UserPool}
  UserPoolClientId: {Value: !Ref UserPoolClient}
  SiteBucketName: {Value: !Ref SiteBucket}
  DistributionId: {Value: !Ref Distribution}
  Region: {Value: !Ref AWS::Region}
  DeployRoleArn: {Value: !GetAtt GitHubDeployRole.Arn}
